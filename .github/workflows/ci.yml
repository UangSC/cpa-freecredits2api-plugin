name: CI

# main 分支提交与 PR 仅运行轻量测试门禁（ubuntu 单机环境，1~2 分钟）；
# 打 v* tag（或手动 workflow_dispatch）时额外触发 5 平台多架构编译，并在 tag 时发布 Release。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 上只保留最新一次运行；tag 构建不取消（要出 Release）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: 测试（gofmt / vet / go test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # 本项目无 go.sum，关闭 setup-go 的模块缓存。
          cache: false

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          # cpasdk/ 是与宿主 ABI 对齐的 vendored 副本，保持与上游一致的排版，不参与格式检查。
          unformatted=$(gofmt -l . | grep -v '^cpasdk/' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: 控制台测试
        run: node --test tests/ui/*.test.mjs

      - name: go test
        run: go test ./... -count=1 -timeout 300s

      - name: race tests
        run: go test -race ./internal/core ./internal/state ./internal/auth ./internal/tasks ./internal/admin -count=1

      - name: 编译 live 探针
        run: go test -tags live ./tests/live -run '^$' -count=1

      - name: 校验 c-shared 编译
        run: go build -buildmode=c-shared -o /dev/null .

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    # 仅在推送 v* tag 或手动触发时才执行多平台重型构建，避免日常 PR/commit 消耗 macOS/Windows 配额
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # Windows amd64 与两个 Linux 架构是必备产物，macOS 按构建结果附加。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, ext: so,    cc: 'zig cc -target x86_64-linux-gnu.2.17',  experimental: false }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, ext: so,    cc: 'zig cc -target aarch64-linux-gnu.2.17', experimental: false }
          - { os: macos-15,       goos: darwin,  goarch: arm64, ext: dylib, cc: clang,                 experimental: true }
          - { os: macos-15,       goos: darwin,  goarch: amd64, ext: dylib, cc: 'clang -arch x86_64', experimental: true }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: dll,   cc: gcc,                   experimental: false }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: 准备 Linux glibc 2.17 编译器
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.15.2.tar.xz"
          curl --fail --location --retry 2 'https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz' -o "$archive"
          printf '%s  %s\n' '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239' "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cpa-zig"
          tar -xf "$archive" -C "$RUNNER_TEMP/cpa-zig" --strip-components=1
          echo "$RUNNER_TEMP/cpa-zig" >> "$GITHUB_PATH"

      - name: 环境信息
        shell: bash
        run: |
          go version
          ${{ matrix.cc }} --version | sed -n '1p'

      - name: 构建 c-shared 插件
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w"
          if [[ -n "$VERSION_TAG" ]]; then
            source_version=$(awk -F '"' '/^const DefaultVersion = / {print $2}' internal/app/app.go)
            if [[ "$VERSION_TAG" != "$source_version" ]]; then
              echo "发版标签 $VERSION_TAG 与源码版本 $source_version 不一致"
              exit 1
            fi
            ldflags+=" -X main.pluginVersion=$VERSION_TAG"
          fi
          go build -buildmode=c-shared -trimpath \
            -ldflags "$ldflags" \
            -o "dist/freecredits2api-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}" .
          ls -la dist

      # 插件商店安装要求归档名 {id}_{version}_{goos}_{goarch}.zip，
      # 且 zip 根目录下只能有 {id}{ext} 一个动态库；见 scripts/packstore。
      - name: 打包插件商店归档（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 归档名里的版本号是 tag 去掉前导 v（宿主按同样规则从 tag 推导）。
          go run ./scripts/packstore \
            -lib "dist/freecredits2api-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}" \
            -id freecredits2api \
            -version "${VERSION_TAG#v}" \
            -goos ${{ matrix.goos }} \
            -goarch ${{ matrix.goarch }} \
            -out-dir dist

      # 只发布商店归档：裸动态库不再单独上传（手动安装者解压 zip 即可）。
      # 非 tag 运行没有 zip，因此这里必须限定在 tag 上，否则 if-no-files-found 会让构建失败。
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: freecredits2api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/freecredits2api_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh 需要 git 仓库上下文（否则报 "not a git repository"）；
      # fetch-depth: 0 是为了读到 tag 注解（Release 正文的「本版要点」）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: 生成插件商店校验和（checksums.txt）
        shell: bash
        run: |
          set -euo pipefail
          # 必须在汇总阶段生成：矩阵里每个平台各写一份同名文件会互相覆盖，
          # 导致部分 zip 的校验和丢失、宿主安装时直接报 checksum not found。
          go run ./scripts/packstore -checksums-dir assets
          cp registry.json assets/registry.json

      - name: 生成 Release 正文（安装说明 + tag 注解）
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 显式取回 tag 对象。注解标签读取注解，轻量标签读取指向的提交说明。
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::warning::${TAG} 不是注解标签，本版要点只会有 commit 标题"
          fi
          {
            echo '## 通过 CPA 插件商店安装（推荐）'
            echo
            echo '在 CPA 插件商店中搜索 **FreeCredits2API** 并安装。'
            echo '默认目录未显示时，可先添加本仓库的插件源再安装。'
            echo
            echo '## 手动安装'
            echo
            echo '下载对应平台的 `freecredits2api_<版本>_<goos>_<goarch>.zip`，解压后把其中的'
            echo '`freecredits2api` 动态库放进 CPA 的 `plugins.dir/<goos>/<goarch>/`。'
            echo '归档里已经用的是宿主要求的 `freecredits2api{ext}` 文件名，解压后无需改名。'
            echo
            echo '| 平台 | 下载归档 |'
            echo '| --- | --- |'
            echo '| Linux x86_64 | `freecredits2api_<版本>_linux_amd64.zip` |'
            echo '| Linux arm64 | `freecredits2api_<版本>_linux_arm64.zip` |'
            echo '| macOS Apple Silicon | `freecredits2api_<版本>_darwin_arm64.zip` |'
            echo '| macOS Intel | `freecredits2api_<版本>_darwin_amd64.zip` |'
            echo '| Windows x64 | `freecredits2api_<版本>_windows_amd64.zip` |'
            echo
            echo '`checksums.txt` 可用于核对归档完整性；配置与账号导入见仓库 README。'
            echo
            echo '## 本版要点'
            echo
            # tag 注解作为本版要点；首行为空时去掉（sed 用 -e 拆写，BSD/GNU 都认）。
            git tag -l --format='%(contents)' "$TAG" | sed -e '1{' -e '/^$/d' -e '}'
          } > release-notes.md
          cat release-notes.md

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "已存在 $TAG 的 Release，保留已发布安装包。"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            assets/*
